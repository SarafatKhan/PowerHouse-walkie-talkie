<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>

    <!-- Outer Rim Metallic Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <!-- Bolt Glow Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Pulse Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Ambient Glow Filter -->
    <filter id="ambientGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>
  </defs>

  <!-- Base Rounded Hexagon/Badge -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#rimGrad)" stroke-width="6" opacity="0.4" />

  <!-- Radiating Audio Wave Arcs (Left) -->
  <path d="M 120 190 A 90 90 0 0 0 120 322" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" opacity="0.35" />
  <path d="M 85 155 A 140 140 0 0 0 85 357" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.2" />

  <!-- Radiating Audio Wave Arcs (Right) -->
  <path d="M 392 190 A 90 90 0 0 1 392 322" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" opacity="0.35" />
  <path d="M 427 155 A 140 140 0 0 1 427 357" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.2" />

  <!-- Central Ambient Glow Backing -->
  <path d="M 285 75 L 185 245 L 255 245 L 225 435 L 345 255 L 275 255 Z" fill="#10b981" opacity="0.35" filter="url(#ambientGlow)" />

  <!-- Central Powerful Lightning Bolt (Power) Merged with Transmitter Mast -->
  <path d="M 290 85 L 195 245 L 265 245 L 220 425 L 340 255 L 270 255 Z" fill="url(#boltGrad)" filter="url(#glow)" stroke="#6ee7b7" stroke-width="4" stroke-linejoin="round" />

  <!-- Center Core Beacon Dot -->
  <circle cx="265" cy="245" r="7" fill="#ffffff" />
</svg>
